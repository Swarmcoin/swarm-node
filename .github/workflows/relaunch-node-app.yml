name: SWARM Node relaunch build (closed start, access code)

# SWARM Node 0.3.0-mainnet.1 for the RESTARTED mainnet (genesis 01b76d8a...),
# built in a PRIVATE repository on a branch of its own. Nothing is published:
# no release, no draft, no upload anywhere but this run's own artifacts.
#
# TWO STAGES, decided by build/binary-pins.json (job `plan`):
#
#   1. tunnel - while any platform has no pinned tunnel hash, build onetun
#               (aramperes/onetun, MIT) FROM SOURCE at the pinned tag with
#               --locked, for all four platforms, and print each SHA-256.
#               Those hashes are then committed to build/binary-pins.json.
#   2. app    - once all four are pinned, package the app: fetch the relaunch
#               node tools (private run 37026735396 of this repository) and the
#               tunnel from the stage-1 run, verify every hash against the pins,
#               and build Windows x64, Linux x64, macOS arm64 and macOS x64.
#               macOS is signed AD HOC (no Developer ID, not notarized): the
#               owner allows it once under Privacy & Security, "Open Anyway".
#
# Triggered by a push to this branch only.

on:
  push:
    branches: ['relaunch/node-app-code']

permissions:
  contents: read
  actions: read          # gh run download of this repository's own artifacts

concurrency:
  group: relaunch-node-app-${{ github.ref }}
  cancel-in-progress: false

env:
  SWARM_NETWORK_PROFILE: swarm-mainnet
  RUST_TOOLCHAIN: '1.91.0'

jobs:
  plan:
    runs-on: ubuntu-22.04
    outputs:
      stage: ${{ steps.p.outputs.stage }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          set -euo pipefail
          stage=$(node -e '
            const p = require("./build/binary-pins.json").profiles["swarm-mainnet"];
            const all = ["win-x64","linux-x64","darwin-arm64","darwin-x64"].every(k => /^[0-9a-f]{64}$/.test(p.platforms[k].tunnel_sha || ""));
            console.log(all ? "app" : "tunnel");')
          echo "stage=$stage" | tee -a "$GITHUB_OUTPUT"

  # ------------------------------------------------------------ stage 1
  tunnel:
    needs: plan
    if: needs.plan.outputs.stage == 'tunnel'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { key: win-x64,      runner: windows-2022,   target: x86_64-pc-windows-msvc,   exe: '.exe' }
          - { key: linux-x64,    runner: ubuntu-22.04,   target: x86_64-unknown-linux-gnu, exe: '' }
          - { key: darwin-arm64, runner: macos-14,       target: aarch64-apple-darwin,     exe: '' }
          - { key: darwin-x64,   runner: macos-15-intel, target: x86_64-apple-darwin,      exe: '' }
    name: onetun ${{ matrix.key }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { path: app }
      - name: Read the pinned onetun tag
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const t=require("./app/build/binary-pins.json").profiles["swarm-mainnet"].tunnel; console.log("tag="+t.tag); console.log("commit="+t.tag_commit)' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: aramperes/onetun
          ref: ${{ steps.pin.outputs.tag }}
          path: onetun
          persist-credentials: false
      - name: The tag is the pinned commit
        shell: bash
        run: |
          set -euo pipefail
          got=$(git -C onetun rev-parse HEAD)
          echo "onetun ${{ steps.pin.outputs.tag }} = $got"
          test "$got" = "${{ steps.pin.outputs.commit }}"
      - name: Toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target ${{ matrix.target }}
          rustc +"$RUST_TOOLCHAIN" --version
      - name: Build onetun from source (--locked)
        shell: bash
        env:
          # Windows: the C runtime linked in, so the tunnel needs no DLL.
          RUSTFLAGS: ${{ matrix.key == 'win-x64' && '-C target-feature=+crt-static' || '' }}
          MACOSX_DEPLOYMENT_TARGET: '11.0'
          TAG: ${{ steps.pin.outputs.tag }}
          COMMIT: ${{ steps.pin.outputs.commit }}
          TARGET: ${{ matrix.target }}
          RUN: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          cd onetun
          cargo +"$RUST_TOOLCHAIN" build --locked --release --target ${{ matrix.target }}
          mkdir -p ../out
          cp "target/${{ matrix.target }}/release/onetun${{ matrix.exe }}" ../out/
          ../out/onetun${{ matrix.exe }} --version
          cd ../out
          if command -v sha256sum >/dev/null; then sha=$(sha256sum "onetun${{ matrix.exe }}" | cut -d' ' -f1); else sha=$(shasum -a 256 "onetun${{ matrix.exe }}" | cut -d' ' -f1); fi
          export SHA="$sha"
          echo "$sha *onetun${{ matrix.exe }}" > SHA256SUMS
          node -e '
            const fs=require("fs");
            fs.writeFileSync("build-manifest.json", JSON.stringify({
              program: "onetun", source: "https://github.com/aramperes/onetun", tag: process.env.TAG, commit: process.env.COMMIT,
              target: process.env.TARGET, toolchain: process.env.RUST_TOOLCHAIN, rustflags: process.env.RUSTFLAGS || "",
              command: "cargo build --locked --release --target " + process.env.TARGET,
              sha256: process.env.SHA, workflow_run: process.env.RUN, built_at_utc: new Date().toISOString()
            }, null, 2) + "\n");'
          cat SHA256SUMS
          echo "::notice title=onetun ${{ matrix.key }}::sha256 $sha"
      - uses: actions/upload-artifact@v4
        with:
          name: onetun-${{ matrix.target }}
          path: out/*
          retention-days: 90
          if-no-files-found: error

  # ------------------------------------------------------------ stage 2
  app:
    needs: plan
    if: needs.plan.outputs.stage == 'app'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { key: win-x64,      runner: windows-2022,   arch: x64 }
          - { key: linux-x64,    runner: ubuntu-22.04,   arch: x64 }
          - { key: darwin-arm64, runner: macos-14,       arch: arm64 }
          - { key: darwin-x64,   runner: macos-15-intel, arch: x64 }
    name: app ${{ matrix.key }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run sweep
      - run: npm test

      - name: Fetch and verify the relaunch node tools and the tunnel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/fetch-pinned-binaries.mjs --platform '${{ matrix.key }}'

      - name: VC++ runtime next to the node (Windows)
        if: matrix.key == 'win-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($dll in @('VCRUNTIME140.dll', 'VCRUNTIME140_1.dll', 'MSVCP140.dll')) {
            $hit = Get-ChildItem -Path "${env:ProgramFiles}\Microsoft Visual Studio\2022" -Recurse -Filter $dll -ErrorAction SilentlyContinue |
                   Where-Object { $_.FullName -match 'Redist\\MSVC\\[^\\]+\\x64' } | Select-Object -First 1
            $src = if ($hit) { $hit.FullName } else { Join-Path $env:SystemRoot "System32\$dll" }
            if (-not (Test-Path $src)) { throw "could not find $dll" }
            Copy-Item $src "resources/bin/$dll" -Force
            Write-Host "$dll <- $src"
          }

      - name: Record the hashes this build may run (node, miner, tunnel)
        run: node scripts/make-binaries-manifest.mjs --require-tunnel

      - name: This is a SWARM mainnet build
        run: node scripts/set-build-profile.mjs swarm-mainnet

      - run: npm run build:ui

      # ---------------- Windows
      - name: Package (Windows)
        if: matrix.key == 'win-x64'
        run: npx electron-builder --win --publish never
      - name: Sweep (Windows)
        if: matrix.key == 'win-x64'
        run: node scripts/string-sweep.mjs release/win-unpacked/resources/app.asar
      - name: Smoke (Windows)
        if: matrix.key == 'win-x64'
        run: node scripts/smoke-renderer.mjs release/win-unpacked smoke
        timeout-minutes: 8

      # ---------------- Linux
      - name: Package (Linux)
        if: matrix.key == 'linux-x64'
        run: npx electron-builder --linux --publish never
      - name: Architecture, sweep and smoke (Linux)
        if: matrix.key == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check-arch.sh release/linux-unpacked x64
          node scripts/string-sweep.mjs release/linux-unpacked/resources/app.asar
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          xvfb-run -a node scripts/smoke-renderer.mjs release/linux-unpacked smoke

      # ---------------- macOS, ad hoc
      - name: Package the app bundle (macOS)
        if: startsWith(matrix.key, 'darwin-')
        run: npx electron-builder --mac --dir --${{ matrix.arch }} --publish never
      - name: Architecture, then sign ad hoc inside out (macOS)
        if: startsWith(matrix.key, 'darwin-')
        shell: bash
        run: |
          set -euo pipefail
          dir=$(find release -maxdepth 1 -type d -name 'mac*' -print -quit)
          app="$dir/SWARM Node.app"
          test -d "$app"
          bash scripts/check-arch.sh "$dir" '${{ matrix.arch }}'
          node scripts/string-sweep.mjs "$app/Contents/Resources/app.asar"
          xattr -cr "$app"
          find "$app" -type f -print0 | while IFS= read -r -d '' f; do
            if file -b "$f" | grep -q 'Mach-O'; then printf '%s\n' "$f"; fi
          done | awk -F/ '{print NF "\t" $0}' | sort -rn -k1,1 | cut -f2- > macho.txt
          echo "Mach-O files: $(wc -l < macho.txt)"
          while IFS= read -r f; do codesign --force --sign - "$f"; done < macho.txt
          find "$app/Contents" -type d \( -name '*.framework' -o -name '*.app' -o -name '*.xpc' -o -name '*.bundle' \) \
            | awk -F/ '{print NF "\t" $0}' | sort -rn -k1,1 | cut -f2- > bundles.txt
          while IFS= read -r b; do
            case "$b" in *.framework) ;; *) test -d "$b/Contents/MacOS" || continue ;; esac
            codesign --force --sign - "$b"
          done < bundles.txt
          codesign --force --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | tee sig.txt
          grep -q '^Signature=adhoc' sig.txt
          grep -q '^Identifier=green.swarm.node$' sig.txt
          while IFS= read -r f; do codesign --verify --strict "$f"; done < macho.txt
          # The three bundled programs start (an invalid signature is SIGKILL on Apple silicon).
          for b in swarm-node-daemon swarm-tunnel; do
            bin="$app/Contents/Resources/bin/$b"
            arg=--version
            perl -e 'alarm 30; exec @ARGV' "$bin" "$arg" | head -3
          done
          echo "APP_DIR=$dir" >> "$GITHUB_ENV"
      - name: DMG and zip (macOS)
        if: startsWith(matrix.key, 'darwin-')
        shell: bash
        run: |
          set -euo pipefail
          v=$(node -p "require('./package.json').version")
          stage=$(mktemp -d)
          ditto "$APP_DIR/SWARM Node.app" "$stage/SWARM Node.app"
          ln -s /Applications "$stage/Applications"
          mkdir -p release-out
          for i in 1 2 3 4 5; do
            hdiutil create -volname "SWARM Node $v" -srcfolder "$stage" -fs HFS+ -format UDZO -imagekey zlib-level=9 -ov \
              "release-out/SWARM-Node-$v-mac-${{ matrix.arch }}.dmg" && break
            echo "hdiutil create failed (attempt $i)"; sleep 10; test "$i" != 5
          done
          hdiutil verify "release-out/SWARM-Node-$v-mac-${{ matrix.arch }}.dmg"
          ( cd "$APP_DIR" && ditto -c -k --sequesterRsrc --keepParent "SWARM Node.app" "$GITHUB_WORKSPACE/release-out/SWARM-Node-$v-mac-${{ matrix.arch }}.zip" )
          # The app inside the new DMG still verifies, and starts for 20 s.
          hdiutil attach -readonly -nobrowse -noautoopen -mountpoint /Volumes/swarm-new "release-out/SWARM-Node-$v-mac-${{ matrix.arch }}.dmg"
          codesign --verify --deep --strict --verbose=2 "/Volumes/swarm-new/SWARM Node.app"
          inst=$(mktemp -d); ditto "/Volumes/swarm-new/SWARM Node.app" "$inst/SWARM Node.app"
          hdiutil detach /Volumes/swarm-new || hdiutil detach -force /Volumes/swarm-new
          home=$(mktemp -d)
          HOME="$home" "$inst/SWARM Node.app/Contents/MacOS/SWARM Node" --remote-debugging-port=9333 > smoke-mac.log 2>&1 &
          pid=$!
          up=0; for s in $(seq 1 20); do sleep 1; if kill -0 "$pid" 2>/dev/null; then up=$s; else break; fi; done
          curl -s --max-time 5 http://127.0.0.1:9333/json/list > pages.json || true
          kill -TERM "$pid" 2>/dev/null || true; sleep 5; pkill -f "$inst" 2>/dev/null || true
          echo "up ${up}s of 20 on $(uname -m)"; cat pages.json; tail -20 smoke-mac.log
          test "$up" -ge 20
          grep -q '"title": "SWARM Node"' pages.json

      - name: Collect, checksums, release manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          shopt -s nullglob
          for f in release/*.exe release/*-win-x64.zip release/*.AppImage release/*.deb release-out/*.dmg release-out/*.zip; do cp "$f" out/; done
          shopt -u nullglob
          test -n "$(ls -A out)"
          sha() { if command -v sha256sum >/dev/null; then sha256sum "$1" | cut -d" " -f1; else shasum -a 256 "$1" | cut -d" " -f1; fi; }
          : > out/SHA256SUMS
          for f in $(ls out | grep -v '^SHA256SUMS$' | sort); do printf "%s *%s\n" "$(sha "out/$f")" "$f" >> out/SHA256SUMS; done
          cat out/SHA256SUMS
          node scripts/make-release-manifest.mjs out '${{ matrix.key }}'
          mv out/SHA256SUMS "out/SHA256SUMS-${{ matrix.key }}"
          mv out/release-manifest.json "out/release-manifest-${{ matrix.key }}.json"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: swarm-node-0.3.0-mainnet.1-${{ matrix.key }}
          path: out/*
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: smoke-${{ matrix.key }}
          path: smoke
          retention-days: 7
          if-no-files-found: ignore
