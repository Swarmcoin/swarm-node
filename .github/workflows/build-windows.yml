name: Build Windows installer

# Produces everything a person needs to install SWARM Node, and nothing else:
#   SWARM-Node-<version>-win-x64.exe   NSIS installer
#   SWARM-Node-<version>-win-x64.zip   portable, no installation
#   SHA256SUMS                         checksums for both
#   release-manifest.json              what went into this build
#
# It does NOT publish a GitHub Release. Publishing is one command once the
# planner has audited the artifacts:
#   gh release create v<version> SWARM-Node-*.exe SWARM-Node-*.zip SHA256SUMS \
#     release-manifest.json -R brs-holding/swarm-node --notes-file RELEASE-NOTES.md

on:
  workflow_dispatch:
    inputs:
      binaries_tag:
        description: 'Pre-release tag in this repo holding zebrad.exe and privacy-miner.exe'
        required: false
        default: 'vendored-binaries-1'
  push:
    branches: [main]
    paths-ignore: ['**/*.md']

permissions:
  contents: write        # read the vendored-binaries pre-release, write the draft build release
  actions: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Does this build still say anything belonging to the earlier product, to
      # upstream, or to the multilevel wording the owner has forbidden?
      - name: String sweep (source)
        run: npm run sweep

      - name: Unit tests
        run: npm test

      # ---- the two binaries this app runs -------------------------------
      #
      # Both are built in brs-holding/privacy-zebra from official Zebra 6.3.0
      # source with no source changes. They are fetched rather than rebuilt, so
      # the thing that ships is the thing that was tested.
      #
      # They come from a PRE-RELEASE of THIS private repository, not from the
      # other repository's workflow artifacts. A private repo's GITHUB_TOKEN
      # cannot read another repository's artifacts, whatever `actions: read`
      # says — that is what broke run 35636846516. A release asset in the same
      # repository is readable with the job's own token, and a release in a
      # private repository is not public.
      #
      # This is a transport, not a trust anchor: the SHA-256 check two steps
      # below is what actually decides, and it is pinned to the hashes the
      # privacy-zebra runs produced.
      - name: Download the pinned binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.event.inputs.binaries_tag }}"
          if (-not $tag) { $tag = "vendored-binaries-1" }
          New-Item -ItemType Directory -Force staging/bin | Out-Null
          gh release download $tag -R ${{ github.repository }} -p "zebrad.exe" -p "privacy-miner.exe" -D staging/bin
          Get-ChildItem -Recurse staging/bin | Select-Object FullName, Length

      - name: Collect and verify the binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force resources/bin | Out-Null

          function Find-One($name) {
            $hit = Get-ChildItem -Path staging -Recurse -Filter $name -ErrorAction SilentlyContinue |
                   Select-Object -First 1
            if (-not $hit) { throw "$name was not found in any downloaded artifact" }
            return $hit.FullName
          }

          # Some artifacts are zipped; expand anything that looks like one first.
          Get-ChildItem -Path staging -Recurse -Filter *.zip -ErrorAction SilentlyContinue | ForEach-Object {
            $dest = Join-Path $_.DirectoryName ($_.BaseName + '_x')
            Expand-Archive -LiteralPath $_.FullName -DestinationPath $dest -Force
          }

          Copy-Item (Find-One 'zebrad.exe') resources/bin/zebrad.exe -Force
          Copy-Item (Find-One 'privacy-miner.exe') resources/bin/privacy-miner.exe -Force

          # swarm-keytool.exe creates spending keys. It must never leave the
          # build machine inside a miner. Make that impossible, not unlikely.
          Get-ChildItem -Path resources/bin -Filter '*keytool*' -ErrorAction SilentlyContinue | ForEach-Object {
            throw "refusing to package $($_.Name)"
          }

          $expected = @{
            'zebrad.exe'        = 'b6ea39096b99debd64b248789d47c8a3a94afea5541e3a75f896b552ac61c477'
            'privacy-miner.exe' = 'e6e16810e5f01688a668d80d11be689c278d2df3b3c5d35d25667b668c35123a'
          }
          foreach ($name in $expected.Keys) {
            $actual = (Get-FileHash "resources/bin/$name" -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $expected[$name]) {
              throw "$name sha256 $actual does not match the pinned $($expected[$name])"
            }
            Write-Host "$name sha256 $actual OK"
          }

      # A clean Windows install has no Visual C++ 2015-2022 runtime, and zebrad
      # will not start without it. Shipping the three DLLs next to the binaries
      # means the installer needs no separate redistributable and no admin step.
      - name: Copy the VC++ runtime DLLs app-locally
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $needed = @('VCRUNTIME140.dll', 'VCRUNTIME140_1.dll', 'MSVCP140.dll')
          $roots = @(
            "${env:ProgramFiles}\Microsoft Visual Studio\2022",
            "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022",
            "${env:ProgramFiles}\Microsoft Visual Studio\2026",
            "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2026"
          ) | Where-Object { Test-Path $_ }

          $found = @{}
          foreach ($root in $roots) {
            Get-ChildItem -Path $root -Recurse -Directory -Filter 'x64' -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match 'Redist\\MSVC' } |
              ForEach-Object {
                foreach ($dll in $needed) {
                  if ($found.ContainsKey($dll)) { continue }
                  $hit = Get-ChildItem -Path $_.FullName -Recurse -Filter $dll -ErrorAction SilentlyContinue |
                         Select-Object -First 1
                  if ($hit) { $found[$dll] = $hit.FullName }
                }
              }
          }
          # Last resort: the copies Windows itself carries.
          foreach ($dll in $needed) {
            if (-not $found.ContainsKey($dll)) {
              $sys = Join-Path $env:SystemRoot "System32\$dll"
              if (Test-Path $sys) { $found[$dll] = $sys }
            }
          }
          foreach ($dll in $needed) {
            if (-not $found.ContainsKey($dll)) { throw "could not find $dll on the runner" }
            Copy-Item $found[$dll] "resources/bin/$dll" -Force
            Write-Host "$dll <- $($found[$dll])"
          }

      - name: Record the binary hashes this build may run
        run: node scripts/make-binaries-manifest.mjs

      - name: Build the renderer
        run: npm run build:ui

      - name: Build the installer and the portable zip
        run: npx electron-builder --win --publish never

      # What ships is the bundle, not the source tree. The sibling wallet fork
      # shipped with an unlock screen still reading "Zingo PC is locked"; this
      # is the step that would have caught it there.
      - name: String sweep (packaged app.asar)
        run: node scripts/string-sweep.mjs release/win-unpacked/resources/app.asar

      # And does the packaged app actually SHOW anything? 0.2.0-testnet.1 passed
      # every other gate and then opened a blank window, because one module in
      # the bundle threw at load and React never mounted. This launches the real
      # packaged app and fails unless something is on the page.
      - name: Renderer smoke test (packaged app must not open blank)
        run: node scripts/smoke-renderer.mjs release/win-unpacked
        timeout-minutes: 6

      - name: Checksums and release manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $net     = Get-Content electron/net/network.json -Raw | ConvertFrom-Json
          $bins    = Get-Content electron/net/binaries.json -Raw | ConvertFrom-Json

          New-Item -ItemType Directory -Force out | Out-Null
          # Only the two files electron-builder produced FOR THE USER, named
          # exactly as artifactName says. A -Recurse here walks into
          # release/win-unpacked and sweeps up the app's own internals —
          # elevate.exe, zebrad.exe, privacy-miner.exe — which then end up on
          # the release looking like things to download. (It did: run
          # 35677791304.) Match the names instead of hunting by extension.
          $wanted = @(
            "SWARM-Node-$version-win-x64.exe",
            "SWARM-Node-$version-win-x64.zip"
          )
          foreach ($name in $wanted) {
            $src = Join-Path 'release' $name
            if (-not (Test-Path -LiteralPath $src)) { throw "electron-builder did not produce $name" }
            Copy-Item $src (Join-Path 'out' $name) -Force
          }
          Write-Host "collected:"; Get-ChildItem out -File | Select-Object Name, Length

          $files = Get-ChildItem out -File | Sort-Object Name
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$h *$($f.Name)"
          }
          [IO.File]::WriteAllText("out/SHA256SUMS", ($lines -join "`n") + "`n", (New-Object Text.UTF8Encoding $false))

          $manifest = [ordered]@{
            product          = 'SWARM Node'
            version          = $version
            built_at_utc     = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            git_commit       = '${{ github.sha }}'
            git_ref          = '${{ github.ref }}'
            workflow_run     = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            runner_image     = "${env:ImageOS}"
            signed           = $false
            signing_note     = 'Unsigned. Windows SmartScreen will warn. See RELEASE-NOTES.md.'
            auto_update      = $false
            app_id           = 'green.swarm.node'
            network          = [ordered]@{
              name    = $net.identity.network_name
              magic   = $net.identity.network_magic
              genesis = $net.genesis.hash
              p2p     = $net.ports.public_p2p
              seeds   = $net.seed_peers
              ticker  = $net.identity.ticker
            }
            bundled_binaries = $bins
            files            = @($files | ForEach-Object {
              [ordered]@{
                name   = $_.Name
                bytes  = $_.Length
                sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              }
            })
          }
          $json = $manifest | ConvertTo-Json -Depth 8
          [IO.File]::WriteAllText("out/release-manifest.json", $json, (New-Object Text.UTF8Encoding $false))

          Get-Content out/SHA256SUMS
          Write-Host "--- release-manifest.json ---"
          Get-Content out/release-manifest.json

      # Primary delivery: a DRAFT pre-release of this private repository.
      #
      # Not published, not public, and not a product release — a draft is
      # invisible outside the repository and has to be published deliberately.
      # It exists because the organisation's Actions artifact storage is full
      # (run 35677346315 built everything correctly and then failed with
      # "Artifact storage quota has been hit"; the ~3.3 GB in use belongs to
      # other workstreams and is not mine to delete). Release assets do not
      # come out of that quota.
      #
      # It is also exactly the shape the planner asked for: publishing after
      # the audit is one command, `gh release edit <tag> --draft=false`.
      - name: Put the build on a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "build-$version"
          $existing = gh release view $tag -R ${{ github.repository }} --json tagName 2>$null
          # Clear any asset a previous run left behind, so the draft always
          # holds exactly this build's four files and nothing else.
          if ($existing) {
            $old = gh release view $tag -R ${{ github.repository }} --json assets -q '.assets[].name' 2>$null
            foreach ($a in $old) { if ($a) { gh release delete-asset $tag $a -R ${{ github.repository }} --yes 2>$null } }
          }

          # The release text is DERIVED FROM release-manifest.json, never from
          # the variables of whichever run happened to create the release. The
          # draft for testnet.1 said "commit 71fe7b1, run 35677791304" while its
          # manifest said 2b6cb6e / 35678117439, because a later run replaced
          # the assets and left the first run's words behind. Now they cannot
          # disagree: both come from the file that ships beside the installer.
          $m = Get-Content out/release-manifest.json -Raw | ConvertFrom-Json
          $sums = (Get-Content out/SHA256SUMS -Raw).Trim()
          $nl = [Environment]::NewLine
          $notes = @(
            "**NOT AUDITED AND NOT PUBLISHED.** A draft build for review."
            ""
            "| | |"
            "| --- | --- |"
            "| Version | ``$($m.version)`` |"
            "| Commit | ``$($m.git_commit)`` |"
            "| Built | $($m.built_at_utc) |"
            "| Workflow run | $($m.workflow_run) |"
            "| Network | $($m.network.name), genesis ``$($m.network.genesis)`` |"
            "| Seed | $($m.network.seeds -join ', ') |"
            "| Signed | no - Windows SmartScreen will warn |"
            "| Automatic updates | off |"
            ""
            "Bundled programs, verified against the hashes their own builds produced:"
            ""
            '```'
            "zebrad.exe         $($m.bundled_binaries.zebrad.sha256)"
            "privacy-miner.exe  $($m.bundled_binaries.miner.sha256)"
            '```'
            ""
            "Downloads:"
            ""
            '```'
            $sums
            '```'
            ""
            "Everything above is read from release-manifest.json, which ships with the"
            "files, so this text and the manifest cannot disagree."
          ) -join $nl
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          [IO.File]::WriteAllText($notesFile, $notes, (New-Object Text.UTF8Encoding $false))

          if (-not $existing) {
            gh release create $tag -R ${{ github.repository }} --draft --prerelease `
              --title "SWARM Node $version (draft — not published)" --notes-file $notesFile
          } else {
            gh release edit $tag -R ${{ github.repository }} `
              --title "SWARM Node $version (draft — not published)" --notes-file $notesFile
          }
          gh release upload $tag -R ${{ github.repository }} --clobber (Get-ChildItem out -File | ForEach-Object { $_.FullName })
          Write-Host "draft release: https://github.com/${{ github.repository }}/releases/tag/$tag"

      # Secondary, and allowed to fail: the same files as a workflow artifact.
      # Convenient while it works, but the quota above makes it unreliable, and
      # a storage limit must never fail a build that produced a good installer.
      - name: Also upload as a workflow artifact (best effort)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: swarm-node-windows-x64
          path: out/**
          if-no-files-found: error
          retention-days: 7
