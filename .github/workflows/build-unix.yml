name: Build Linux and macOS packages

# The same app as the Windows workflow, for the other two platforms.
#
#   SWARM-Node-<version>-linux-x86_64.AppImage   portable, one file
#   swarm-node_<version>_amd64.deb               Debian and Ubuntu
#   SWARM-Node-<version>-mac-arm64.dmg / .zip    Apple silicon
#   SWARM-Node-<version>-mac-x64.dmg / .zip      Intel Macs
#   SHA256SUMS, release-manifest.json            per platform
#
# It does NOT publish a GitHub Release. Linux lands on a DRAFT pre-release;
# unsigned macOS builds are CI artifacts only. They must not overwrite or be
# mistaken for Developer ID notarized packages built on the owner's Mac.
#
# WHY A MATRIX AND NOT THREE FILES: the steps are identical apart from which
# pinned binaries are fetched and which electron-builder target is asked for.
# Three copies of the same fifteen steps is three places for them to drift.

on:
  workflow_dispatch:
    inputs:
      verify_signed_intel:
        description: 'Verify the published signed mainnet Intel DMG on an Intel Mac'
        type: boolean
        default: false
      network_profile:
        description: 'Which SWARM network this build is for: swarm-testnet or swarm-mainnet'
        required: false
        default: 'swarm-testnet'
        type: choice
        options: [swarm-testnet, swarm-mainnet]
      binaries_tag:
        description: 'Override the pre-release tag holding the pinned node and miner (the pinned HASHES are never overridden)'
        required: false
        default: ''
      platforms:
        description: 'Which to build: all, linux, mac-arm64, mac-x64'
        required: false
        default: 'all'

permissions:
  contents: write        # read the vendored-binaries pre-release, write the draft
  actions: read

jobs:
  select-platforms:
    if: ${{ !inputs.verify_signed_intel }}
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.select.outputs.result }}
    steps:
      # The readiness check below reads build/binary-pins.json, so this job
      # needs the repository too.
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        id: select
        env:
          PLATFORMS: ${{ inputs.platforms || 'all' }}
          PROFILE: ${{ inputs.network_profile || 'swarm-testnet' }}
        with:
          script: |
            const rows = [{"key":"linux-x64","runs-on":"ubuntu-22.04","builder":"--linux","expect":"x86_64|amd64","arch":"x64"},{"key":"darwin-arm64","runs-on":"macos-14","builder":"--mac --arm64","expect":"mac-arm64","arch":"arm64"},{"key":"darwin-x64","runs-on":"macos-15-intel","builder":"--mac --x64","expect":"mac-x64","arch":"x64"}];
            const aliases = {linux: 'linux-x64', 'mac-arm64': 'darwin-arm64', 'mac-x64': 'darwin-x64'};
            const requested = process.env.PLATFORMS;
            if (requested !== 'all' && !aliases[requested]) throw new Error(`Unknown platform: ${requested}`);
            const selected = rows.filter(row => requested === 'all' || row.key === aliases[requested]);
            // A platform is buildable only when this profile pins a real
            // SHA-256 for both of its binaries. An unpinned platform is
            // skipped, never built from whatever the release happens to hold.
            const pins = JSON.parse(require('fs').readFileSync('build/binary-pins.json', 'utf8'));
            const profile = pins.profiles[process.env.PROFILE];
            if (!profile) throw new Error(`No binary pins for network profile ${process.env.PROFILE}`);
            const hex = (v) => /^[a-f0-9]{64}$/.test(String(v || ''));
            const ready = selected.filter(row => {
              const pin = profile.platforms[row.key];
              return pin && hex(pin.node_sha) && hex(pin.miner_sha) && (profile.layout !== 'archive' || hex(pin.archive_sha));
            });
            if (requested !== 'all' && ready.length !== selected.length) throw new Error(`Binary hashes are missing for ${requested} on ${process.env.PROFILE}`);
            if (!ready.length) throw new Error(`No platforms have verified binary hashes for ${process.env.PROFILE}`);
            for (const row of selected.filter(row => !ready.includes(row))) core.notice(`Skipping ${row.key}: ${process.env.PROFILE} binary hashes pending`);
            return {include: ready};
  build:
    needs: select-platforms
    strategy:
      # One platform failing must not cancel the others: a macOS runner being
      # scarce is not a reason to lose a good Linux package.
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-platforms.outputs.matrix) }}

    name: ${{ matrix.key }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: String sweep (source)
        run: npm run sweep

      - name: Unit tests
        run: npm test

      # ---- the two binaries this app runs -------------------------------
      #
      # Fetched, never rebuilt here, so the thing that ships is the thing that
      # was tested. WHICH binaries, and their SHA-256s, are data: build/binary-pins.json,
      # read by scripts/fetch-pinned-binaries.mjs. swarm-testnet takes them
      # from a pre-release of THIS private repository (a private repo's token
      # cannot read another repository's workflow artifacts); swarm-mainnet
      # takes one archive per platform from the PUBLIC privacy-zebra release.
      # The SHA-256 gate inside the script is what decides, and an overridden
      # tag does not override a hash.
      - name: Fetch, verify and place the pinned binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SWARM_NETWORK_PROFILE: ${{ inputs.network_profile || 'swarm-testnet' }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/fetch-pinned-binaries.mjs --platform '${{ matrix.key }}' ${{ inputs.binaries_tag && format('--tag {0}', inputs.binaries_tag) || '' }}

      - name: Record the binary hashes this build may run
        run: node scripts/make-binaries-manifest.mjs

      # WHICH NETWORK THIS BUILD IS FOR, recorded INSIDE the build. See the
      # same step in build-windows.yml: 0.2.0-mainnet.1 was a mainnet build
      # that started on the testnet because nothing in the packaged app
      # recorded which network it was made for.
      - name: Record which network this build is for
        env:
          SWARM_NETWORK_PROFILE: ${{ inputs.network_profile || 'swarm-testnet' }}
        run: node scripts/set-build-profile.mjs

      - name: Build the renderer
        run: npm run build:ui

      - name: Build the packages
        run: npx electron-builder ${{ matrix.builder }} --publish never

      # A NAME IS NOT EVIDENCE. This reads the Electron executable and both
      # bundled programs with lipo (macOS) or readelf (Linux) and fails the
      # build unless every one of them really is this job's architecture.
      # A package named mac-x64 carrying arm64 binaries reached a draft once.
      - name: Every binary must really be this architecture
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/check-arch.sh
          if [ "$RUNNER_OS" = macOS ]; then
            dir=$(find release -maxdepth 1 -type d -name 'mac*' -print -quit)
          else
            dir=$(find release -maxdepth 1 -type d -name 'linux-unpacked*' -print -quit)
          fi
          [ -n "$dir" ] || { echo "no unpacked build found"; ls -R release | head -40; exit 1; }
          scripts/check-arch.sh "$dir" '${{ matrix.arch }}'

      - name: String sweep (packaged app.asar)
        shell: bash
        run: |
          set -euo pipefail
          asar=$(find release -name app.asar -print -quit)
          [ -n "$asar" ] || { echo "no app.asar was produced"; exit 1; }
          node scripts/string-sweep.mjs "$asar"

      # Does the packaged app actually SHOW anything? testnet.1 passed every
      # other gate and then opened blank. On Linux there is no display on a
      # runner, so the whole thing runs under a virtual one; the app's window
      # is never shown either way (SWARM_NODE_HEADLESS).
      - name: Renderer smoke test
        shell: bash
        run: |
          set -euo pipefail
          dir=$(find release -maxdepth 1 -type d \( -name 'linux-unpacked' -o -name 'mac' -o -name 'mac-arm64' \) -print -quit)
          [ -n "$dir" ] || { echo "no unpacked build found"; ls -R release | head -40; exit 1; }
          if [ "$RUNNER_OS" = macOS ]; then
            # The unpacked mac build is an .app bundle; the executable is inside.
            dir="$dir/SWARM Node.app/Contents/MacOS"
          fi
          echo "smoke-testing $dir"
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
            xvfb-run -a node scripts/smoke-renderer.mjs "$dir" smoke
          else
            node scripts/smoke-renderer.mjs "$dir" smoke
          fi
        timeout-minutes: 10

      - name: Checksums and release manifest
        shell: bash
        env:
          # make-release-manifest.mjs read the TESTNET definition whatever the
          # profile was, so a mainnet build recorded SwarmTestnet. It reads this.
          SWARM_NETWORK_PROFILE: ${{ inputs.network_profile || 'swarm-testnet' }}
        run: |
          set -euo pipefail
          mkdir -p out
          # Only the files a PERSON downloads. A blanket copy sweeps in
          # blockmaps, the unpacked tree and the app's own internals, which
          # then appear on the release looking like things to install.
          shopt -s nullglob
          for f in release/*.AppImage release/*.deb release/*.dmg release/*.zip; do
            # THE ARCHITECTURE MUST MATCH THE BINARIES THIS JOB STAGED.
            #
            # Listing both Apple architectures in package.json made
            # electron-builder build BOTH on the arm64 runner, so a file named
            # "mac-x64" was produced carrying arm64 node and miner binaries -
            # a package that cannot run on the machine its name promises. It
            # reached the draft before I noticed. Now a file that does not
            # carry this job's architecture fails the build instead.
            base=$(basename "$f")
            if ! echo "$base" | grep -Eq '${{ matrix.expect }}'; then
              echo "REFUSING $base: this job staged ${{ matrix.key }} binaries, and that name does not match"
              exit 1
            fi
            cp "$f" out/
          done
          shopt -u nullglob
          if [ -z "$(ls -A out)" ]; then
            echo "electron-builder produced nothing to ship"; ls -R release | head -40; exit 1
          fi
          ls -l out

          sha() { if command -v sha256sum >/dev/null; then sha256sum "$1" | cut -d" " -f1; else shasum -a 256 "$1" | cut -d" " -f1; fi; }
          # LF endings, no trailing blank line, same shape as the Windows build.
          : > out/SHA256SUMS
          for f in $(ls out | grep -v "^SHA256SUMS$" | sort); do
            printf "%s *%s\n" "$(sha "out/$f")" "$f" >> out/SHA256SUMS
          done
          cat out/SHA256SUMS

          node scripts/make-release-manifest.mjs out ${{ matrix.key }}

      # Linux may update the private draft. The Windows workflow owns its own
      # artifacts. Unsigned Mac packages remain CI artifacts until this Mac's
      # Developer ID build passes a fresh browser-download install.
      - name: Add this platform's files to the draft release
        if: matrix.key == 'linux-x64'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="build-$version"
          # SHA256SUMS and release-manifest.json are per platform, so they are
          # renamed before upload. Two platforms uploading "SHA256SUMS" would
          # silently overwrite one another.
          mv out/SHA256SUMS "out/SHA256SUMS-${{ matrix.key }}"
          mv out/release-manifest.json "out/release-manifest-${{ matrix.key }}.json"
          ls -l out

          if gh release view "$tag" -R '${{ github.repository }}' >/dev/null 2>&1; then
            echo "adding to the existing draft $tag"
          else
            gh release create "$tag" -R '${{ github.repository }}' --draft --prerelease \
              --title "SWARM Node $version (draft — not published)" \
              --notes "**NOT AUDITED AND NOT PUBLISHED.** A draft build for review." || \
              gh release view "$tag" -R '${{ github.repository }}' >/dev/null
          fi
          gh release upload "$tag" -R '${{ github.repository }}' --clobber out/*
          echo "draft release: https://github.com/${{ github.repository }}/releases/tag/$tag"

      - name: Keep unsigned macOS packages as CI test artifacts
        if: startsWith(matrix.key, 'darwin-')
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-test-${{ matrix.key }}
          path: |
            out/*.dmg
            out/*.zip
            out/SHA256SUMS
            out/release-manifest.json
          retention-days: 14

      - name: Keep the smoke screenshots as evidence
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: smoke-${{ matrix.key }}
          path: smoke
          retention-days: 7

  verify-signed-intel:
    if: ${{ inputs.verify_signed_intel }}
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install verification dependencies
        run: npm ci
      - name: Download and hash the published Intel packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p signed-intel
          gh release download swarm-node-0.2.0-mainnet.5 \
            --repo Swarm-Official/swarm-releases \
            --pattern 'SWARM-Node-0.2.0-mainnet.5-mac-x64.*' \
            --pattern 'SHA256SUMS-mac-x64' --dir signed-intel
          cd signed-intel
          shasum -a 256 -c SHA256SUMS-mac-x64
      - name: Verify Gatekeeper and launch the published Intel app
        run: |
          set -euo pipefail
          dmg=signed-intel/SWARM-Node-0.2.0-mainnet.5-mac-x64.dmg
          hdiutil verify "$dmg"
          xcrun stapler validate "$dmg"
          hdiutil attach -readonly -nobrowse -mountpoint /Volumes/SWARM-Node-Intel-Verify "$dmg"
          app='/Volumes/SWARM-Node-Intel-Verify/SWARM Node.app'
          bash scripts/check-arch.sh /Volumes/SWARM-Node-Intel-Verify x64
          codesign --verify --deep --strict "$app"
          spctl --assess --type execute --verbose=4 "$app"
          xcrun stapler validate "$app"
          node -e 'const a=require("@electron/asar"); const p=process.argv[1]; const v=JSON.parse(a.extractFile(p,"electron/net/build-profile.json")); if(v.profile!=="swarm-mainnet") throw Error(`wrong profile: ${v.profile}`);' "$app/Contents/Resources/app.asar"
          "$app/Contents/Resources/bin/swarm-node-daemon" --version
          "$app/Contents/Resources/bin/swarm-miner" --help >/dev/null
          node scripts/smoke-renderer.mjs "$app/Contents/MacOS" signed-intel/smoke
          ditto -x -k signed-intel/SWARM-Node-0.2.0-mainnet.5-mac-x64.zip signed-intel/zip-app
          codesign --verify --deep --strict 'signed-intel/zip-app/SWARM Node.app'
      - name: Detach the test image
        if: always()
        run: hdiutil detach /Volumes/SWARM-Node-Intel-Verify || true
