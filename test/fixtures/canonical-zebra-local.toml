# SwarmTestnet -- Zebra local profile.
# Generated by scripts/swarm/render_config.py from
# D:/privacy/network/swarm-testnet/manifest.json. Do not edit by hand: edit the
# manifest and render again.
# Reward allocation: 80% miner, 8% Core Development, 4% Grants & Ecosystem, 8% Community & Development Reserve.
# Testnet engineering settings. Not a mainnet launch, not audited.

[network]
network = "Testnet"
listen_addr = "0.0.0.0:18233"
initial_mainnet_peers = []
initial_testnet_peers = ["seed.swarm.green:18233"]
cache_dir = false
max_connections_per_ip = 8
peerset_initial_target_size = 2

[network.testnet_parameters]
network_name = "SwarmTestnet"
network_magic = [83, 87, 82, 77]
genesis_hash = "045993f5c91ea160c7ebda573dd97b0016816bca68d395bfff202779b88e2a28"
disable_pow = false
checkpoints = false
# Keep the upstream Testnet bound: an easier limit can overflow the
# 17-target difficulty average.
target_difficulty_limit = "07ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff"
slow_start_interval = 0
pre_blossom_halving_interval = 840000
extend_funding_stream_addresses_as_required = true
lockbox_disbursements = []

# Reward allocation, specs/ECONOMICS.md v0.4. One range covers the
# whole emission schedule; the miner keeps the remainder plus fees.
funding_streams = [
  { height_range = { start = 1, end = 50399999 }, recipients = [
    { receiver = "ECC", numerator = 8, addresses = ["t2DGVURG5tAyXXSkj85JV5xbvTobYv7H99n"] },  # Core Development
    { receiver = "MajorGrants", numerator = 4, addresses = ["t2LVPzRYpZ4QtRRmQMS1zWUmG7TZaYcMjBR"] },  # Grants & Ecosystem
    { receiver = "ZcashFoundation", numerator = 8, addresses = ["t2UHhsicXnapNJrfewHqgwXef5HDwCHd7wk"] },  # Community & Development Reserve
  ] },
]

[network.testnet_parameters.activation_heights]
BeforeOverwinter = 1
Overwinter = 1
Sapling = 1
Blossom = 1
Heartwood = 1
Canopy = 1
NU5 = 1
NU6 = 1
"NU6.1" = 1
"NU6.2" = 1
"NU6.3" = 1

[state]
cache_dir = "%LOCALAPPDATA%/SwarmNode/state"

[rpc]
listen_addr = "127.0.0.1:18232"
cookie_dir = "%LOCALAPPDATA%/SwarmNode"
enable_cookie_auth = true
parallel_cpu_threads = 2

[sync]
parallel_cpu_threads = 2

[mempool]
# A private network must not wait for the public Zcash chain tip.
# Proof-of-work validation stays enabled above.
debug_enable_at_height = 0

[mining]
# miner_address = "your transparent testnet payout address"
internal_miner = false

[tracing]
use_color = false
