# SwarmMainnet -- SWARM Node local profile.
# Generated by SWARM Node from the network definition embedded in this build.
# Do not edit by hand: the app rewrites this file on every start.
# SwarmMainnet is SWARM's own production network. It is not upstream Zcash:
# different magic (SWMN), different genesis, different transaction domain.

[network]
network = "SwarmMainnet"
listen_addr = "0.0.0.0:28233"
initial_mainnet_peers = []
initial_testnet_peers = []
initial_swarm_main_peers = ["seed-main.swarm.green:28233"]
cache_dir = false

# The only values this file supplies. Everything else about
# SwarmMainnet -- the network magic, the difficulty limit, the
# halving schedule, the activation heights, the 8/4/8 split and the
# V5/V6-only rule -- is compiled into the node and cannot be
# configured, so this app cannot change what the network is.
[network.swarm_main]
genesis_hash = "11112222333344445555666677778888999900001111222233334444fedcba98"
p2p_port = 28233
rpc_port = 28232

[network.swarm_main.funding_stream_addresses]
core_development = "s3XQAEbW98DwCkm2BVbeXnkjYCHTfbVSdQH"  # Core Development
grants_ecosystem = "s3Ya32FvTepiaNQVZbE7outyXuvFe1rqmbF"  # Grants & Ecosystem
community_reserve = "s3keLR3h9JgxCarwHpaRDptdR4nZNXD6qBv"  # Community & Development Reserve

[state]
cache_dir = "C:/SWARM/chain-mainnet/state"

[rpc]
listen_addr = "127.0.0.1:28232"
cookie_dir = "C:/SWARM/chain-mainnet"
enable_cookie_auth = true
parallel_cpu_threads = 2

[sync]
parallel_cpu_threads = 2

[health]
# SwarmMainnet is not a test network, so Zebra applies this gate
# without the opt-in a configured testnet needs.
min_connected_peers = 1
ready_max_tip_age = "900s"

[mining]
miner_address = "s1MCkDhVejM4RqDyRR1rEJkudd26FVWipPD"
internal_miner = false

[tracing]
use_color = false
